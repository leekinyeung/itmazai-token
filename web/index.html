<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>TaoDock</title>
    <meta name="title" content="TaoDock" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <!-- Social cards must be present in the initial HTML for crawlers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TaoDock" />
    <meta property="og:url" content="https://taodock.com/" />
    <meta property="og:title" content="TaoDock" />
    <meta
      property="og:description"
      content="Unified AI API gateway and admin dashboard."
    />
    <meta property="og:image" content="https://taodock.com/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TaoDock" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TaoDock" />
    <meta
      name="twitter:description"
      content="Unified AI API gateway and admin dashboard."
    />
    <meta name="twitter:image" content="https://taodock.com/social-card.png" />
    <meta name="twitter:image:alt" content="TaoDock" />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
