    <meta name="theme-color" content="#fff" />
    <style>
      .server-fallback {
        box-sizing: border-box;
        width: min(72rem, 100%);
        margin: 0 auto;
        padding: 5rem 1.5rem 3rem;
        color: #172033;
        font:
          400 1rem/1.65 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      .server-fallback section {
        margin: 0 0 3rem;
      }
      .server-fallback__hero {
        max-width: 52rem;
      }
      .server-fallback h1 {
        margin: 0.25rem 0 1rem;
        font-size: clamp(2.25rem, 6vw, 4.75rem);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }
      .server-fallback h2 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        line-height: 1.3;
      }
      .server-fallback__eyebrow {
        color: #e11d48;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .server-fallback__lead {
        font-size: 1.2rem;
      }
      .server-fallback nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        margin-top: 1.5rem;
      }
      .server-fallback a {
        color: #be123c;
        font-weight: 650;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      .server-fallback__price-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
        gap: 1rem;
        margin-top: 1.25rem;
      }
      .server-fallback__card-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
        gap: 1rem;
        margin-top: 1.25rem;
      }
      .server-fallback__price {
        border: 1px solid #d8dee9;
        border-radius: 0.9rem;
        padding: 1rem;
      }
      .server-fallback__card {
        border: 1px solid #d8dee9;
        border-radius: 0.9rem;
        padding: 1rem;
      }
      .server-fallback__price p {
        margin-bottom: 0;
      }
      .server-fallback--error {
        max-width: 44rem;
        padding-top: 8rem;
      }
      html.dark .server-fallback {
        color: #e5e7eb;
      }
      html.dark .server-fallback__price {
        border-color: #374151;
      }
      html.dark .server-fallback__card {
        border-color: #374151;
      }
      html.dark .server-fallback a,
      html.dark .server-fallback__eyebrow {
        color: #fb7185;
      }
      #root[data-client-pending] > [data-client-root] {
        position: absolute;
        inset: 0;
        width: 100%;
        visibility: hidden;
        pointer-events: none;
      }
      #root[data-client-pending] > [data-server-fallback] {
        position: relative;
        z-index: 1;
      }
      .server-home-frame {
        font-family:
          'Public Sans Variable', 'Public Sans', ui-sans-serif, system-ui,
          sans-serif;
      }
      .server-home-frame[data-server-home-variant='custom'],
      .server-home-frame[data-server-home-variant='loading'] {
        --server-home-orbit-opacity-low: 0.5;
        --server-home-orbit-opacity-high: 0.86;
        --server-home-orbit-opacity-static: 0.68;
        display: flex;
        min-height: 100svh;
        overflow: hidden;
        isolation: isolate;
        color: oklch(0.145 0 0);
        background:
          radial-gradient(
            circle at 50% 48%,
            oklch(0.7 0.17 250 / 0.1),
            transparent 22rem
          ),
          radial-gradient(
            ellipse at 45% 54%,
            oklch(0.72 0.2 328 / 0.06),
            transparent 30rem
          ),
          oklch(1 0 0);
      }
      .server-home-loading {
        position: relative;
        z-index: 1;
        display: flex;
        flex: 1;
        min-height: 100svh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
        text-align: center;
      }
      .server-home-mark {
        position: relative;
        display: grid;
        width: 12rem;
        height: 12rem;
        margin-bottom: 0.25rem;
        place-items: center;
      }
      .server-home-bloom {
        position: absolute;
        inset: 0;
        animation: server-home-bloom-spin 18s linear infinite;
        will-change: transform;
      }
      .server-home-orbit {
        --server-home-orbit-rotation: 0deg;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10.5rem;
        height: 4.5rem;
        border-radius: 999px;
        background: radial-gradient(
          ellipse at center,
          transparent 36%,
          var(--server-home-orbit-color) 54%,
          transparent 74%
        );
        filter: blur(8px);
        opacity: var(--server-home-orbit-opacity-static);
        transform: translate(-50%, -50%)
          rotate(var(--server-home-orbit-rotation)) scale(0.94);
        animation: server-home-orbit-breathe 3.6s ease-in-out infinite alternate;
        will-change: transform, opacity;
      }
      .server-home-orbit--blue {
        --server-home-orbit-color: oklch(0.72 0.17 245 / 0.72);
        --server-home-orbit-rotation: 10deg;
      }
      .server-home-orbit--violet {
        --server-home-orbit-color: oklch(0.64 0.21 286 / 0.65);
        --server-home-orbit-rotation: 130deg;
        animation-delay: -1.2s;
      }
      .server-home-orbit--pink {
        --server-home-orbit-color: oklch(0.72 0.22 334 / 0.62);
        --server-home-orbit-rotation: 250deg;
        animation-delay: -2.4s;
      }
      .server-home-logo-shell {
        position: relative;
        z-index: 1;
        display: grid;
        width: 5rem;
        height: 5rem;
        place-items: center;
        animation: server-home-logo-float 2.8s ease-in-out infinite;
        will-change: transform;
      }
      .server-home-logo {
        display: block;
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.125rem;
        filter: drop-shadow(0 1rem 1.5rem oklch(0.38 0.15 270 / 0.2));
        object-fit: contain;
      }
      .server-home-brand {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .server-home-message {
        margin: 0;
        color: oklch(0.49 0 0);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      @keyframes server-home-bloom-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes server-home-orbit-breathe {
        from {
          opacity: var(--server-home-orbit-opacity-low);
          transform: translate(-50%, -50%)
            rotate(var(--server-home-orbit-rotation)) scale(0.92);
        }
        to {
          opacity: var(--server-home-orbit-opacity-high);
          transform: translate(-50%, -50%)
            rotate(var(--server-home-orbit-rotation)) scale(1.08);
        }
      }
      @keyframes server-home-logo-float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-0.2rem) scale(1.025);
        }
      }
      .server-home-menu,
      .server-home-menu::before,
      .server-home-menu::after {
        display: block;
        width: 1rem;
        height: 1.5px;
        border-radius: 999px;
        background: currentColor;
      }
      .server-home-menu {
        position: relative;
      }
      .server-home-menu::before,
      .server-home-menu::after {
        content: '';
        position: absolute;
        left: 0;
      }
      .server-home-menu::before {
        top: -4px;
      }
      .server-home-menu::after {
        top: 4px;
      }
      html.dark .server-home-frame[data-server-home-variant='custom'],
      html.dark .server-home-frame[data-server-home-variant='loading'] {
        --server-home-orbit-opacity-low: 0.58;
        --server-home-orbit-opacity-high: 0.94;
        --server-home-orbit-opacity-static: 0.82;
        color: oklch(0.965 0 0);
        background:
          radial-gradient(
            circle at 50% 48%,
            oklch(0.55 0.2 260 / 0.2),
            transparent 24rem
          ),
          radial-gradient(
            ellipse at 44% 55%,
            oklch(0.58 0.22 328 / 0.11),
            transparent 32rem
          ),
          oklch(0.235 0 0);
      }
      html.dark .server-home-message {
        color: oklch(0.78 0 0);
      }
      html.dark .server-home-logo {
        filter: drop-shadow(0 1.25rem 2rem oklch(0.2 0.12 270 / 0.55));
      }
      @media (max-width: 30rem) {
        .server-home-mark {
          width: 9.5rem;
          height: 9.5rem;
        }
        .server-home-orbit {
          width: 8.25rem;
          height: 3.5rem;
          filter: blur(7px);
        }
        .server-home-logo-shell {
          width: 4.5rem;
          height: 4.5rem;
        }
        .server-home-logo {
          width: 4rem;
          height: 4rem;
          border-radius: 1rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .server-home-bloom,
        .server-home-orbit,
        .server-home-logo-shell {
          animation: none;
        }
        .server-home-bloom {
          transform: rotate(8deg);
        }
        .server-home-orbit {
          opacity: var(--server-home-orbit-opacity-static);
          transform: translate(-50%, -50%)
            rotate(var(--server-home-orbit-rotation)) scale(1);
        }
      }
    </style>
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          var savedTheme = localStorage.getItem('newapi:theme:v1:mode')
          if (
            savedTheme === 'dark' ||
            savedTheme === 'light' ||
            savedTheme === 'system'
          ) {
            theme = savedTheme
          }
        } catch (e) {}
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <script>
      ;(function () {
        var root = document.getElementById('root')
        if (!root) return
        var fallback = root.querySelector('[data-server-fallback="home"]')
        var copyNode = root.querySelector('[data-home-fallback-copy]')
        if (!fallback || !copyNode) return

        var resources
        try {
          resources = JSON.parse(copyNode.textContent || '{}')
        } catch (e) {
          return
        }

        var saved = ''
        try {
          saved = localStorage.getItem('i18nextLng') || ''
        } catch (e) {}
        var candidates = [saved].concat(
          Array.prototype.slice.call(navigator.languages || []),
          [navigator.language || 'en']
        )
        var language = 'en'
        for (var index = 0; index < candidates.length; index += 1) {
          var value = String(candidates[index] || '')
            .replace(/_/g, '-')
            .toLowerCase()
          if (!value) continue
          if (
            value === 'zhtw' ||
            value === 'zh-tw' ||
            value === 'zh-hk' ||
            value === 'zh-mo' ||
            value.indexOf('zh-hant') === 0
          ) {
            language = 'zh-TW'
          } else if (
            value === 'zhcn' ||
            value === 'zh' ||
            value === 'zh-cn' ||
            value.indexOf('zh-hans') === 0
          ) {
            language = 'zh'
          } else if (/^(en|fr|ja|ru|vi)(-|$)/.test(value)) {
            language = value.split('-')[0]
          } else {
            continue
          }
          if (resources[language]) break
          language = 'en'
        }

        var copy = resources[language] || resources.en || {}
        var rawBrand = fallback.getAttribute('data-server-brand') || 'TaoDock'
        var brandKey = rawBrand.trim().toLowerCase()
        var brand =
          brandKey === 'taodock' ||
          brandKey === '众妙之门' ||
          brandKey === '眾妙之門'
            ? copy.TaoDock || rawBrand
            : rawBrand
        var translate = function (key, element) {
          var result = copy[key] || (resources.en && resources.en[key]) || key
          if (element && element.hasAttribute('data-fallback-brand-value')) {
            result = result.replace(/\{\{brand\}\}/g, brand)
          }
          if (element && element.hasAttribute('data-fallback-audience')) {
            var audienceKey = element.getAttribute('data-fallback-audience')
            var audience = copy[audienceKey] || audienceKey
            result = result.replace(/\{\{audience\}\}/g, audience)
          }
          return result
        }

        fallback
          .querySelectorAll('[data-fallback-brand]')
          .forEach(function (el) {
            el.textContent = brand
          })
        fallback
          .querySelectorAll('[data-fallback-i18n]')
          .forEach(function (el) {
            el.textContent = translate(
              el.getAttribute('data-fallback-i18n'),
              el
            )
          })
        fallback
          .querySelectorAll('[data-fallback-i18n-aria-label]')
          .forEach(function (el) {
            var key = el.getAttribute('data-fallback-i18n-aria-label')
            el.setAttribute('aria-label', translate(key, el))
          })
        var docsLanguagePath =
          language === 'zh' || language === 'zh-TW' ? '' : '/en'
        fallback
          .querySelectorAll('[data-fallback-doc-path]')
          .forEach(function (el) {
            var docPath = el.getAttribute('data-fallback-doc-path') || ''
            if (docPath.charAt(0) === '/' && docPath.charAt(1) !== '/') {
              el.setAttribute(
                'href',
                'https://docs.taodock.com' + docsLanguagePath + docPath
              )
            }
          })
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : language
      })()
    </script>
  </body>
