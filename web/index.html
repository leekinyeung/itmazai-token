    <style>
      .server-fallback {
        box-sizing: border-box;
        width: min(72rem, 100%);
        margin: 0 auto;
        padding: 5rem 1.5rem 3rem;
        color: #172033;
        font:
          400 1rem/1.65 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      .server-fallback section {
        margin: 0 0 3rem;
      }
      .server-fallback__hero {
        max-width: 52rem;
      }
      .server-fallback h1 {
        margin: 0.25rem 0 1rem;
        font-size: clamp(2.25rem, 6vw, 4.75rem);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }
      .server-fallback h2 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        line-height: 1.3;
      }
      .server-fallback__eyebrow {
        color: #e11d48;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .server-fallback__lead {
        font-size: 1.2rem;
      }
      .server-fallback nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        margin-top: 1.5rem;
      }
      .server-fallback a {
        color: #be123c;
        font-weight: 650;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      .server-fallback__price-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
        gap: 1rem;
        margin-top: 1.25rem;
      }
      .server-fallback__card-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
        gap: 1rem;
        margin-top: 1.25rem;
      }
      .server-fallback__price {
        border: 1px solid #d8dee9;
        border-radius: 0.9rem;
        padding: 1rem;
      }
      .server-fallback__card {
        border: 1px solid #d8dee9;
        border-radius: 0.9rem;
        padding: 1rem;
      }
      .server-fallback__price p {
        margin-bottom: 0;
      }
      .server-fallback--error {
        max-width: 44rem;
        padding-top: 8rem;
      }
      html.dark .server-fallback {
        color: #e5e7eb;
      }
      html.dark .server-fallback__price {
        border-color: #374151;
      }
      html.dark .server-fallback__card {
        border-color: #374151;
      }
      html.dark .server-fallback a,
      html.dark .server-fallback__eyebrow {
        color: #fb7185;
      }
      #root[data-client-pending] > [data-client-root] {
        position: absolute;
        inset: 0;
        width: 100%;
        visibility: hidden;
        pointer-events: none;
      }
      #root[data-client-pending] > [data-server-fallback] {
        position: relative;
        z-index: 1;
      }
      .server-home-frame {
        display: flex;
        min-height: 100svh;
        color: oklch(0.145 0 0);
        background: oklch(1 0 0);
        font-family:
          'Public Sans Variable', 'Public Sans', ui-sans-serif, system-ui,
          sans-serif;
      }
      .server-home-loading {
        display: flex;
        flex: 1;
        min-height: 100svh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      .server-home-logo {
        display: block;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.75rem;
        object-fit: contain;
      }
      .server-home-brand {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.75rem;
        font-weight: 600;
      }
      .server-home-message {
        margin: 0;
        color: oklch(0.49 0 0);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      html.dark .server-home-frame {
        color: oklch(0.965 0 0);
        background: oklch(0.235 0 0);
      }
      html.dark .server-home-message {
        color: oklch(0.78 0 0);
      }
    </style>
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          var savedTheme = localStorage.getItem('newapi:theme:v1:mode')
          if (
            savedTheme === 'dark' ||
            savedTheme === 'light' ||
            savedTheme === 'system'
          ) {
            theme = savedTheme
          }
        } catch (e) {}
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <script>
      ;(function () {
        var root = document.getElementById('root')
        if (!root) return
        var fallback = root.querySelector('[data-server-fallback="home"]')
        var copyNode = root.querySelector('[data-home-fallback-copy]')
        if (!fallback || !copyNode) return

        var resources
        try {
          resources = JSON.parse(copyNode.textContent || '{}')
        } catch (e) {
          return
        }

        var saved = ''
        try {
          saved = localStorage.getItem('i18nextLng') || ''
        } catch (e) {}
        var candidates = [saved].concat(
          Array.prototype.slice.call(navigator.languages || []),
          [navigator.language || 'en']
        )
        var language = 'en'
        for (var index = 0; index < candidates.length; index += 1) {
          var value = String(candidates[index] || '')
            .replace(/_/g, '-')
            .toLowerCase()
          if (!value) continue
          if (
            value === 'zhtw' ||
            value === 'zh-tw' ||
            value === 'zh-hk' ||
            value === 'zh-mo' ||
            value.indexOf('zh-hant') === 0
          ) {
            language = 'zh-TW'
          } else if (
            value === 'zhcn' ||
            value === 'zh' ||
            value === 'zh-cn' ||
            value.indexOf('zh-hans') === 0
          ) {
            language = 'zh'
          } else if (/^(en|fr|ja|ru|vi)(-|$)/.test(value)) {
            language = value.split('-')[0]
          } else {
            continue
          }
          if (resources[language]) break
          language = 'en'
        }

        var copy = resources[language] || resources.en || {}
        var rawBrand = fallback.getAttribute('data-server-brand') || 'TaoDock'
        var brandKey = rawBrand.trim().toLowerCase()
        var brand =
          brandKey === 'taodock' ||
          brandKey === '众妙之门' ||
          brandKey === '眾妙之門'
            ? copy.TaoDock || rawBrand
            : rawBrand
        var translate = function (key) {
          return copy[key] || (resources.en && resources.en[key]) || key
        }

        fallback
          .querySelectorAll('[data-fallback-brand]')
          .forEach(function (el) {
            el.textContent = brand
          })
        fallback
          .querySelectorAll('[data-fallback-i18n]')
          .forEach(function (el) {
            el.textContent = translate(el.getAttribute('data-fallback-i18n'))
          })
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : language
      })()
    </script>
  </body>
