server {
    listen 80;
    server_name docs.taodock.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://docs.taodock.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name docs.taodock.com;

    ssl_certificate /etc/letsencrypt/live/docs.taodock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.taodock.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/taodock-handbook/current;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
